<title>¡Vamos! — 14 días para Madrid</title>
<style>
  :root {
    --ink: #eef2f1;
    --ink-dim: #a89a90;
    --ground: #1a1210;
    --ground-raised: #221816;
    --ground-card: #2c1e1a;
    --line: #3d2820;
    --gold: #e8a020;
    --gold-dim: #7a5518;
    --flag-red: #c60b1e;
    --flag-yellow: #f1bf00;
    --good: #5fbf8f;
    --bad: #d9705a;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
  }
  :root[data-theme="light"] {
    --ink: #1b1008; --ink-dim: #7a5a40; --ground: #fdf6ee; --ground-raised: #ffffff;
    --ground-card: #ffffff; --line: #e8d8c0; --gold: #a0600a; --gold-dim: #d8b87a;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --ink: #1b1008; --ink-dim: #7a5a40; --ground: #fdf6ee; --ground-raised: #ffffff;
      --ground-card: #ffffff; --line: #e8d8c0; --gold: #a0600a; --gold-dim: #d8b87a;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(ellipse 900px 500px at 50% -10%, color-mix(in srgb, var(--flag-red) 8%, transparent), transparent), var(--ground);
    color: var(--ink); font-family: var(--font-body);
    display: flex; align-items: flex-start; justify-content: center; padding: 28px 16px 48px;
  }
  .stage { width: 100%; max-width: 600px; }
  .passport {
    background: var(--ground-raised); border: 1px solid var(--line); border-radius: 14px;
    padding: 26px 28px 30px; box-shadow: 0 30px 60px -30px rgba(0,0,0,0.5);
  }

  header.masthead {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 20px;
  }
  .masthead h1 { font-family: var(--font-display); font-size: 1.45rem; letter-spacing: 0.02em; margin: 0; text-wrap: balance; }
  .masthead .sub { font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); margin-top: 4px; }
  .board { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 0.82rem; color: var(--gold); text-align: right; line-height: 1.5; white-space: nowrap; }
  .board .label { color: var(--ink-dim); font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase; display: block; }

  .eyebrow { font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); margin: 0 0 8px; }
  .prompt { font-family: var(--font-display); font-size: 1.45rem; line-height: 1.35; margin: 0 0 20px; text-wrap: balance; }
  .prompt .es { color: var(--gold); }
  .muted { color: var(--ink-dim); font-size: 0.85rem; }

  /* Flag meter */
  .flag-wrap { display: flex; align-items: flex-end; justify-content: center; height: 96px; margin: 0 0 18px; }
  .flag {
    display: flex; flex-direction: column; border-radius: 2px; overflow: hidden;
    box-shadow: 0 4px 14px -4px rgba(0,0,0,0.45), 0 0 0 1px color-mix(in srgb, var(--line) 70%, transparent);
    transition: width 0.6s cubic-bezier(.2,.8,.2,1), height 0.6s cubic-bezier(.2,.8,.2,1);
  }
  .flag .rt { background: var(--flag-red); flex: 1; }
  .flag .y  { background: var(--flag-yellow); flex: 2; }
  .flag .rb { background: var(--flag-red); flex: 1; }

  /* Progress bar */
  .progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 0 0 22px; }
  .progress > div { height: 100%; background: var(--gold); width: 0; transition: width 0.3s; }

  /* Buttons */
  button { font-family: var(--font-body); }
  .btn {
    font-size: 0.85rem; font-weight: 600; color: var(--ground); background: var(--gold);
    border: none; border-radius: 7px; padding: 10px 18px; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .btn.ghost { background: transparent; color: var(--ink-dim); border: 1px solid var(--line); font-weight: 500; }
  .btn.ghost:hover { color: var(--ink); border-color: var(--gold-dim); filter: none; }
  .btn:disabled { opacity: 0.45; cursor: default; filter: none; }
  .footer-row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
  .footer-row .spacer { flex: 1; }
  button.next { opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  button.next.show { opacity: 1; pointer-events: auto; }

  /* Options */
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .options.single { grid-template-columns: 1fr; }
  .opt {
    display: flex; align-items: center; gap: 10px; text-align: left;
    background: var(--ground-card); border: 1px solid var(--line); border-radius: 9px;
    padding: 13px 14px; color: var(--ink); font-size: 0.96rem; cursor: pointer;
    transition: border-color 0.15s, transform 0.1s, background 0.15s;
  }
  .opt:hover:not(:disabled) { border-color: var(--gold-dim); transform: translateY(-1px); }
  .opt:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .opt .tag {
    font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-dim); border: 1px solid var(--line);
    border-radius: 4px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .say { margin-left: auto; font-size: 0.95rem; opacity: 0.45; flex-shrink: 0; padding: 4px 6px; border-radius: 6px; cursor: pointer; transition: opacity 0.15s, background 0.15s; }
  .opt:hover .say, .say:hover, .say:focus-visible { opacity: 1; background: color-mix(in srgb, var(--gold) 16%, transparent); }
  .opt:disabled { cursor: default; }
  .opt.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--ground-card)); }
  .opt.correct .tag { border-color: var(--good); color: var(--good); }
  .opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--ground-card)); }
  .opt.wrong .tag { border-color: var(--bad); color: var(--bad); }
  .opt.dim { opacity: 0.45; }

  .feedback { min-height: 24px; margin-top: 14px; font-size: 0.85rem; color: var(--ink-dim); line-height: 1.45; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }
  .feedback .ans { color: var(--ink); font-weight: 600; }

  /* Text input */
  .field { display: flex; gap: 10px; align-items: stretch; }
  input.text {
    flex: 1; min-width: 0; font-family: var(--font-body); font-size: 1.05rem; color: var(--ink);
    background: var(--ground-card); border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px;
  }
  input.text:focus { outline: 2px solid var(--gold); outline-offset: 1px; border-color: var(--gold-dim); }
  input.text.ok { border-color: var(--good); }
  input.text.ko { border-color: var(--bad); }
  input.text:disabled { opacity: 0.8; }
  .gap-sentence { font-family: var(--font-display); font-size: 1.4rem; line-height: 1.6; margin: 0 0 16px; }
  .gap-sentence input.text { display: inline-block; width: 8ch; padding: 4px 10px; font-size: 1.15rem; margin: 0 4px; text-align: center; }
  .hint { font-size: 0.8rem; color: var(--ink-dim); margin: 8px 0 0; }

  /* Chips (sentence builder & matching) */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px; padding: 10px; border-radius: 9px; border: 1px dashed var(--line); margin-bottom: 12px; }
  .chips.answer { border-style: solid; background: color-mix(in srgb, var(--gold) 6%, transparent); }
  .chip {
    background: var(--ground-card); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px;
    font-size: 0.95rem; color: var(--ink); cursor: pointer; transition: border-color 0.15s, transform 0.1s;
  }
  .chip:hover:not(:disabled) { border-color: var(--gold-dim); transform: translateY(-1px); }
  .chip:disabled { cursor: default; }
  .chip.used { opacity: 0.25; pointer-events: none; }
  .chip.sel { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 16%, var(--ground-card)); }
  .chip.locked { border-color: var(--good); color: var(--good); pointer-events: none; }
  .chip.flash { border-color: var(--bad); }
  .match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .match .col { display: flex; flex-direction: column; gap: 8px; }
  .match .chip { text-align: left; border-radius: 9px; }

  /* Dialogue bubble */
  .bubble { position: relative; background: var(--ground-card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 0 0 16px; }
  .bubble .who { font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 4px; }
  .bubble .line { font-family: var(--font-display); font-size: 1.25rem; color: var(--gold); display: flex; align-items: center; gap: 8px; }
  .bubble .ctx { font-size: 0.8rem; color: var(--ink-dim); margin-top: 6px; }

  /* Listening */
  .play { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; }
  .play .big { font-size: 1.4rem; background: var(--ground-card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 20px; cursor: pointer; }
  .play .big:hover { border-color: var(--gold-dim); }

  /* Home: plan grid */
  .stats { display: flex; gap: 10px; margin: 0 0 18px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 120px; background: var(--ground-card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stat .v { font-family: var(--font-mono); font-size: 1.3rem; color: var(--gold); font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 0.64rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); margin-top: 2px; }
  .plan { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 18px; }
  .day {
    display: flex; align-items: center; gap: 10px; text-align: left; background: var(--ground-card);
    border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; color: var(--ink); cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
  }
  .day:hover { border-color: var(--gold-dim); transform: translateY(-1px); }
  .day .n { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-dim); width: 22px; flex-shrink: 0; }
  .day .t { font-size: 0.86rem; line-height: 1.25; }
  .day .t small { display: block; color: var(--ink-dim); font-size: 0.72rem; margin-top: 2px; }
  .day .done { margin-left: auto; color: var(--good); font-size: 0.9rem; }
  .day.today { border-color: var(--gold); }
  .day.review { border-style: dashed; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }

  /* Day intro */
  .tip { background: color-mix(in srgb, var(--gold) 8%, var(--ground-card)); border: 1px solid var(--gold-dim); border-radius: 10px; padding: 12px 14px; font-size: 0.86rem; line-height: 1.5; margin: 0 0 18px; }
  .tip b { color: var(--gold); }
  .preview { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
  .preview span { font-size: 0.8rem; color: var(--ink-dim); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }

  /* Summary */
  .summary h1 { font-family: var(--font-display); font-size: 1.9rem; margin: 6px 0; text-align: center; }
  .summary .result { text-align: center; color: var(--ink-dim); font-family: var(--font-mono); margin: 0 0 18px; }
  .review-list { list-style: none; padding: 0; margin: 0 0 18px; display: flex; flex-direction: column; gap: 6px; }
  .review-list li { display: flex; justify-content: space-between; gap: 10px; font-size: 0.86rem; padding: 8px 12px; background: var(--ground-card); border: 1px solid var(--line); border-radius: 8px; }
  .review-list li .es { color: var(--gold); }

  .tts-toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 8px); max-width: 90vw;
    background: var(--ground-card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 16px; font-size: 0.82rem; box-shadow: 0 12px 30px -12px rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 100;
  }
  .tts-toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) { .flag, .opt, .chip, .day { transition: none; } }
  @media (max-width: 440px) {
    .options, .plan, .match { grid-template-columns: 1fr; }
    .passport { padding: 20px 16px 24px; }
    .prompt { font-size: 1.3rem; }
  }
</style>

  <div class="passport" id="app"></div>
</div>

/* =========================================================
   STATE & PERSISTENCE
   ========================================================= */
const STORE_KEY = "vamos_madrid_v1";
let state = load();
function load() {
  try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && s.done) return s; } catch (e) {}
  return { done: {}, mistakes: [], lastDate: null, streak: 0 };
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function bumpStreak() {
  const t = todayStr();
  if (state.lastDate === t) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  state.streak = (state.lastDate === y.toISOString().slice(0, 10)) ? state.streak + 1 : 1;
  state.lastDate = t; save();
}
function addMistake(item) {
  const key = item.key;
  const ex = state.mistakes.find(m => m.key === key);
  if (ex) ex.count++; else state.mistakes.push({ ...item, count: 1 });
  save();
}
function clearMistake(key) { state.mistakes = state.mistakes.filter(m => m.key !== key); save(); }

/* =========================================================
   HELPERS
   ========================================================= */
const LETTERS = ["A", "B", "C", "D"];
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(arr, n) { return shuffle(arr).slice(0, n); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function norm(s) { return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[¿¡?!.,;:"'()]/g, "").replace(/\s+/g, " ").trim(); }
function normNum(s) { return String(s).trim().replace(",", ".").replace(/€|euros?|h$/gi, "").replace(/\s+/g, ""); }
function sayBtn(text) { return `<span class="say" data-say="${esc(text)}" role="button" tabindex="0" aria-label="Listen">🔊</span>`; }
function tokens(s) { return norm(s).split(" ").filter(Boolean); }

/* =========================================================
   EXERCISE GENERATION
   ========================================================= */
// Normalise raw day data to fixed shapes (day id always in the last slot):
//   vocab    [en, es, day]
//   sentence [en, es, alts[], day]
//   gap      [sentence, answer, hint, alts[], day]
//   number   [es, answers[], day]
function shapeDay(d) {
  return {
    vocab: d.vocab.map(v => [v[0], v[1], d.id]),
    sentences: d.sentences.map(s => [s[0], s[1], s[2] || [], d.id]),
    dialogues: d.dialogues.map(x => ({ ...x, day: d.id })),
    gaps: d.gaps.map(g => [g[0], g[1], g[2], g[3] || [], d.id]),
    numbers: (d.numbers || []).map(n => [n[0], n[1], d.id])
  };
}
function dayContent(day) {
  const src = (day.review ? day.review.map(id => DAYS.find(d => d.id === id)) : [day]).map(shapeDay);
  return {
    vocab: src.flatMap(c => c.vocab),
    sentences: src.flatMap(c => c.sentences),
    dialogues: src.flatMap(c => c.dialogues),
    gaps: src.flatMap(c => c.gaps),
    numbers: src.flatMap(c => c.numbers)
  };
}
const ALL_VOCAB = DAYS.filter(d => !d.review).flatMap(d => shapeDay(d).vocab);
const ALL_SENT = DAYS.filter(d => !d.review).flatMap(d => shapeDay(d).sentences);

function distractorsFrom(pool, correct, n, field) {
  const seen = new Set([norm(correct)]);
  const out = [];
  for (const item of shuffle(pool)) {
    const v = field(item); const k = norm(v);
    if (seen.has(k)) continue;
    seen.add(k); out.push(v);
    if (out.length === n) break;
  }
  return out;
}

function exMcqEnEs(v, pool) { return { type: "mcq", key: "v:" + v[1], src: { kind: "vocab", v }, label: "Choose the Spanish", prompt: v[0], correct: v[1], options: shuffle([v[1], ...distractorsFrom(pool, v[1], 3, x => x[1])]), spanishOpts: true }; }
function exMcqEsEn(v, pool) { return { type: "mcq", key: "v:" + v[1], src: { kind: "vocab", v }, label: "What does it mean?", prompt: v[1], promptEs: true, correct: v[0], options: shuffle([v[0], ...distractorsFrom(pool, v[0], 3, x => x[0])]), spanishOpts: false }; }
function exMatch(vs) { return { type: "match", key: "m:" + vs.map(v => v[1]).join("|"), src: null, label: "Match the pairs", pairs: vs }; }
function exListen(s, pool) { return { type: "listen", key: "s:" + s[1], src: { kind: "sentence", s }, label: "Listen — what did you hear?", audio: s[1], correct: s[1], options: shuffle([s[1], ...distractorsFrom(pool, s[1], 3, x => x[1])]) }; }
function exBuilder(s, pool) {
  const words = s[1].replace(/[¿¡?!.,;:]/g, "").split(/\s+/).filter(Boolean);
  const others = pool.filter(x => x !== s).flatMap(x => x[1].replace(/[¿¡?!.,;:]/g, "").split(/\s+/)).filter(w => !words.map(norm).includes(norm(w)));
  const extra = pick([...new Set(others)], 2);
  return { type: "builder", key: "s:" + s[1], src: { kind: "sentence", s }, label: "Build the sentence", prompt: s[0], target: s[1], chips: shuffle([...words, ...extra]) };
}
function exType(s) { return { type: "type", key: "s:" + s[1], src: { kind: "sentence", s }, label: "Write it in Spanish", prompt: s[0], answer: s[1], alts: s[2] || [] }; }
function exGap(g) { return { type: "gap", key: "g:" + g[0], src: { kind: "gap", g }, label: "Fill the gap", sentence: g[0], answer: g[1], hint: g[2], alts: g[3] || [] }; }
function exDialogue(d) { return { type: "dialogue", key: "d:" + d.says + d.opts[0][0], src: { kind: "dialogue", d }, label: d.ask === "mean" ? "What does it mean?" : "What do you say?", d, options: shuffle(d.opts) }; }
function exNumber(n) { return { type: "number", key: "n:" + n[0], src: { kind: "number", n }, label: "Price or time — type the number", prompt: n[0], answers: n[1] }; }

function buildSession(day) {
  const c = dayContent(day);
  const ttsOK = !!window.speechSynthesis;
  const isReview = !!day.review;
  const nV = isReview ? 5 : 4, nS = isReview ? 4 : 3;

  // Weight mistakes: pull items from the bank that belong to this day's sources
  const dayIds = isReview ? day.review : [day.id];
  const bank = state.mistakes.filter(m => dayIds.includes(m.day));

  const recog = [
    ...pick(c.vocab, nV).map(v => exMcqEnEs(v, c.vocab)),
    ...pick(c.vocab, 3).map(v => exMcqEsEn(v, c.vocab)),
    exMatch(pick(c.vocab, 5))
  ];
  const compr = [
    ...(ttsOK ? pick(c.sentences, nS).map(s => exListen(s, c.sentences)) : []),
    ...pick(c.dialogues, isReview ? 5 : 4).map(exDialogue),
    ...pick(c.numbers, isReview ? 3 : 4).map(exNumber)
  ];
  const prod = [
    ...pick(c.gaps, 5).map(exGap),
    ...pick(c.sentences, 3).map(s => exBuilder(s, c.sentences)),
    ...pick(c.sentences, 3).map(exType)
  ];
  let list = [...shuffle(recog), ...shuffle(compr), ...shuffle(prod)];
  // Inject up to 4 mistake-bank items as production exercises
  for (const m of pick(bank, 4)) {
    const ex = exerciseFromMistake(m); if (ex) list.splice(recog.length + compr.length, 0, ex);
  }
  // De-dupe by key+type
  const seen = new Set(); list = list.filter(e => { const k = e.type + e.key; if (seen.has(k)) return false; seen.add(k); return true; });
  return list;
}
function exerciseFromMistake(m) {
  const s = m.src; if (!s) return null;
  if (s.kind === "vocab") return exMcqEnEs(s.v, ALL_VOCAB);
  if (s.kind === "sentence") return Math.random() < 0.5 ? exBuilder(s.s, ALL_SENT) : exType(s.s);
  if (s.kind === "gap") return exGap(s.g);
  if (s.kind === "dialogue") return exDialogue(s.d);
  if (s.kind === "number") return exNumber(s.n);
  return null;
}
function buildMistakeSession() {
  return pick(state.mistakes, 16).map(exerciseFromMistake).filter(Boolean);
}
function buildFlagChallenge() {
  return pick(ALL_VOCAB, 10).map(v => exMcqEnEs(v, ALL_VOCAB));
}

/* =========================================================
   SPEECH (Chrome-safe)
   ========================================================= */
let spanishVoice = null, currentUtterance = null;
function loadVoice() {
  const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  spanishVoice = voices.find(v => /^es[-_]ES/i.test(v.lang)) || voices.find(v => /^es/i.test(v.lang)) || null;
  return voices;
}
if (window.speechSynthesis) { loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function showToast(msg) {
  let t = document.getElementById("ttsToast");
  if (!t) { t = document.createElement("div"); t.id = "ttsToast"; t.className = "tts-toast"; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("show"); clearTimeout(showToast._t); showToast._t = setTimeout(() => t.classList.remove("show"), 4000);
}
function speak(text) {
  if (!text) return;
  if (!window.speechSynthesis) { showToast("This browser doesn't support text-to-speech."); return; }
  const voices = loadVoice();
  const go = () => {
    if (speechSynthesis.paused) speechSynthesis.resume();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "es-ES"; if (spanishVoice) u.voice = spanishVoice; u.rate = 0.88; currentUtterance = u;
    let started = false;
    u.onstart = () => { started = true; };
    u.onend = () => { if (currentUtterance === u) currentUtterance = null; };
    u.onerror = ev => { if (ev.error === "canceled" || ev.error === "interrupted") return; showToast("Couldn't play audio (" + ev.error + ")."); };
    try { speechSynthesis.speak(u); } catch (e) { showToast("Speech failed to start."); return; }
    setTimeout(() => { if (!started && !speechSynthesis.speaking && !speechSynthesis.pending) showToast(voices.length ? "No Spanish voice found on this device." : "No text-to-speech voices installed."); }, 900);
  };
  if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); setTimeout(go, 130); } else go();
}
document.addEventListener("click", e => { const s = e.target.closest(".say"); if (s) { e.stopPropagation(); speak(s.dataset.say); } });
document.addEventListener("keydown", e => { const s = e.target.closest && e.target.closest(".say"); if (s && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.stopPropagation(); speak(s.dataset.say); } });

function flagHtml(t, max) {

}

function renderIntro(day) {
  const c = dayContent(day);
  const preview = day.review ? [] : pick(day.vocab, 10);
  app.innerHTML = `
    <header class="masthead">

    <p class="muted">Flow: recognise → understand → produce. Wrong answers go to your mistakes bank for later drilling. Press <b>Enter</b> to check / continue.</p>

function startSession(cfg) {
  if (!cfg.list.length) { showToast("Nothing to practise yet."); return; }
  session = { ...cfg, i: 0, score: 0, wrong: [] };
  renderExercise();
}

function renderExercise() {
  const s = session; const ex = s.list[s.i];
  if (!ex) return renderSummary();
  const n = s.list.length;
  app.innerHTML = `
    <header class="masthead">
      <div><h1>${esc(s.title)}</h1><div class="sub">${esc(s.sub)}</div></div>

    </div>
  `;
  app.querySelector("#quit").addEventListener("click", () => { if (confirm("Quit this session? Progress on this day won't be saved.")) renderHome(); });
  app.querySelector("#nextBtn").addEventListener("click", () => { s.i++; renderExercise(); });
  RENDER[ex.type](ex, app.querySelector("#body"));
}

function finish(ex, ok, correctText, note) {
  const s = session;
  if (ok) s.score++; else { s.wrong.push({ ex, correctText }); if (ex.src) addMistake({ key: ex.key, src: ex.src, day: ex.src.v ? ex.src.v[2] : ex.src.s ? ex.src.s[3] : ex.src.g ? ex.src.g[4] : ex.src.d ? ex.src.d.day : ex.src.n ? ex.src.n[2] : 0, es: correctText }); }
  if (ok && session.mode === "mistakes") clearMistake(ex.key);
  const fb = app.querySelector("#feedback");
  fb.className = "feedback " + (ok ? "good" : "bad");
  fb.innerHTML = ok ? `¡Correcto!${note ? " — " + note : ""}` : `Not quite. Correct: <span class="ans">${esc(correctText)}</span> ${sayBtn(correctText)}${note ? "<br>" + note : ""}`;
  app.querySelector(".flag-wrap").innerHTML = flagHtml(s.score / s.list.length, 150);
  app.querySelector(".board").innerHTML = `<span class="label">Exercise</span>${s.i + 1} / ${s.list.length}<span class="label" style="margin-top:6px">Score</span>${s.score}`;
  const chk = app.querySelector("#check"); if (chk) chk.style.display = "none";
  const nb = app.querySelector("#nextBtn"); nb.classList.add("show"); nb.focus();
}

// Enter: check or continue
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !session) return;
  const chk = app.querySelector("#check"), nb = app.querySelector("#nextBtn");
  if (chk && chk.style.display !== "none" && !chk.disabled) { e.preventDefault(); chk.click(); }
  else if (nb && nb.classList.contains("show")) { e.preventDefault(); nb.click(); }
});

/* ---------- Renderers ---------- */
const RENDER = {
  mcq(ex, body) {
    body.innerHTML = `<p class="prompt ${ex.promptEs ? "es" : ""}">${esc(ex.prompt)} ${ex.promptEs ? sayBtn(ex.prompt) : ""}</p>
      <div class="options">${ex.options.map((o, i) => `<button class="opt" data-v="${esc(o)}"><span class="tag">${LETTERS[i]}</span><span>${esc(o)}</span>${ex.spanishOpts ? sayBtn(o) : ""}</button>`).join("")}</div>`;
    body.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      const ok = b.dataset.v === ex.correct;
      body.querySelectorAll(".opt").forEach(o => { o.disabled = true; if (o.dataset.v === ex.correct) o.classList.add("correct"); else if (o === b) o.classList.add("wrong"); else o.classList.add("dim"); });
      finish(ex, ok, ex.correct);
    }));
  },

  dialogue(ex, body) {
    const d = ex.d;
    body.innerHTML = `
      <div class="bubble"><div class="who">${esc(d.who)}</div>
        ${d.says !== "..." ? `<div class="line">${esc(d.says)} ${sayBtn(d.says)}</div>` : ""}
        ${d.ctx ? `<div class="ctx">${esc(d.ctx)}</div>` : ""}</div>
      <p class="muted" style="margin:0 0 12px">${d.ask === "mean" ? "Pick the meaning." : d.ask === "say" ? "What do you say?" : "How do you reply?"}</p>
      <div class="options single">${ex.options.map((o, i) => `<button class="opt" data-i="${i}"><span class="tag">${LETTERS[i]}</span><span>${esc(o[0])}</span>${d.ask !== "mean" ? sayBtn(o[0]) : ""}</button>`).join("")}</div>`;
    const correct = ex.options.find(o => o[1])[0];
    body.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      const o = ex.options[+b.dataset.i]; const ok = !!o[1];
      body.querySelectorAll(".opt").forEach(x => { x.disabled = true; const xo = ex.options[+x.dataset.i]; if (xo[1]) x.classList.add("correct"); else if (x === b) x.classList.add("wrong"); else x.classList.add("dim"); });
      finish(ex, ok, correct);
    }));
  },

  listen(ex, body) {
    body.innerHTML = `<div class="play"><button class="big" id="replay">🔊 Play</button><span class="muted">Listen, then pick what you heard.</span></div>
      <div class="options single">${ex.options.map((o, i) => `<button class="opt" data-v="${esc(o)}"><span class="tag">${LETTERS[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
    body.querySelector("#replay").addEventListener("click", () => speak(ex.audio));
    speak(ex.audio);
    body.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      const ok = b.dataset.v === ex.correct;
      body.querySelectorAll(".opt").forEach(o => { o.disabled = true; if (o.dataset.v === ex.correct) o.classList.add("correct"); else if (o === b) o.classList.add("wrong"); else o.classList.add("dim"); });
      finish(ex, ok, ex.correct);
    }));
  },

  match(ex, body) {
    const left = shuffle(ex.pairs.map(p => p[1])), right = shuffle(ex.pairs.map(p => p[0]));
    body.innerHTML = `<p class="muted" style="margin:0 0 12px">Tap a Spanish word, then its English meaning.</p>
      <div class="match"><div class="col">${left.map(t => `<button class="chip" data-side="l" data-v="${esc(t)}">${esc(t)}</button>`).join("")}</div>
      <div class="col">${right.map(t => `<button class="chip" data-side="r" data-v="${esc(t)}">${esc(t)}</button>`).join("")}</div></div>`;
    let sel = null, errors = 0, done = 0;
    body.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
      if (c.classList.contains("locked")) return;
      if (!sel || sel.dataset.side === c.dataset.side) { body.querySelectorAll(".chip.sel").forEach(x => x.classList.remove("sel")); sel = c; c.classList.add("sel"); if (c.dataset.side === "l") speak(c.dataset.v); return; }
      const es = sel.dataset.side === "l" ? sel.dataset.v : c.dataset.v, en = sel.dataset.side === "l" ? c.dataset.v : sel.dataset.v;
      const pair = ex.pairs.find(p => p[1] === es && p[0] === en);
      if (pair) { sel.classList.add("locked"); c.classList.add("locked"); sel.classList.remove("sel"); done++; }
      else { errors++; [sel, c].forEach(x => { x.classList.add("flash"); setTimeout(() => x.classList.remove("flash"), 400); }); sel.classList.remove("sel"); }
      sel = null;
      if (done === ex.pairs.length) finish(ex, errors === 0, ex.pairs.map(p => p[1] + " = " + p[0]).join(", "), errors ? `${errors} slip${errors > 1 ? "s" : ""} on the way.` : "Clean sweep.");
    }));
  },

  builder(ex, body) {
    body.innerHTML = `<p class="prompt">${esc(ex.prompt)}</p>
      <div class="chips answer" id="ans"></div>
      <div class="chips" id="pool">${ex.chips.map((w, i) => `<button class="chip" data-i="${i}">${esc(w)}</button>`).join("")}</div>
      <p class="hint">Tap words in order. Tap a word in the top row to remove it. Two words are decoys.</p>`;
    const ans = body.querySelector("#ans"), pool = body.querySelector("#pool"), chk = app.querySelector("#check");
    let order = []; chk.style.display = ""; chk.disabled = true;
    const sync = () => {
      ans.innerHTML = order.map(i => `<button class="chip" data-i="${i}">${esc(ex.chips[i])}</button>`).join("");
      pool.querySelectorAll(".chip").forEach(c => c.classList.toggle("used", order.includes(+c.dataset.i)));
      ans.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => { order = order.filter(i => i !== +c.dataset.i); sync(); }));
      chk.disabled = order.length === 0;
    };
    pool.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => { if (!order.includes(+c.dataset.i)) { order.push(+c.dataset.i); sync(); } }));
    chk.onclick = () => {
      const got = order.map(i => ex.chips[i]).join(" ");
      const ok = norm(got) === norm(ex.target);
      body.querySelectorAll(".chip").forEach(c => c.disabled = true);
      ans.style.borderColor = ok ? "var(--good)" : "var(--bad)";
      finish(ex, ok, ex.target, ok ? undefined : `You wrote: “${esc(got)}”`);
    };
  },

  type(ex, body) {
    body.innerHTML = `<p class="prompt">${esc(ex.prompt)}</p>
      <div class="field"><input class="text" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe en español…"><button class="btn ghost" id="hintBtn">Hint</button></div>
      <p class="hint" id="hintTxt">Accents are checked softly — a missing á/ñ still counts, but you'll see the correct form.</p>`;
    const inp = body.querySelector("#inp"), chk = app.querySelector("#check"); chk.style.display = ""; chk.disabled = false; inp.focus();
    body.querySelector("#hintBtn").addEventListener("click", () => { const w = ex.answer.split(" "); body.querySelector("#hintTxt").textContent = "Starts with: " + w.slice(0, Math.min(2, w.length)).join(" ") + (w.length > 2 ? " …" : "") + ` (${w.length} words)`; });
    chk.onclick = () => {
      const got = inp.value; if (!norm(got)) { inp.focus(); return; }
      const accepted = [ex.answer, ...ex.alts];
      const exact = accepted.some(a => a.trim().replace(/\s+/g, " ").toLowerCase() === got.trim().replace(/\s+/g, " ").toLowerCase());
      const ok = exact || accepted.some(a => norm(a) === norm(got));
      inp.disabled = true; inp.classList.add(ok ? "ok" : "ko");
      finish(ex, ok, ex.answer, ok && !exact ? `Mind the spelling/accents: <span class="ans">${esc(ex.answer)}</span>` : undefined);
    };
  },

  gap(ex, body) {
    const parts = ex.sentence.split("___");
    body.innerHTML = `<p class="gap-sentence">${esc(parts[0])}<input class="text" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:${Math.max(6, ex.answer.length + 2)}ch">${esc(parts[1] || "")}</p>
      <p class="hint">Hint: ${esc(ex.hint)}</p>`;
    const inp = body.querySelector("#inp"), chk = app.querySelector("#check"); chk.style.display = ""; chk.disabled = false; inp.focus();
    chk.onclick = () => {
      const got = inp.value; if (!norm(got)) { inp.focus(); return; }
      const accepted = [ex.answer, ...ex.alts];
      const exact = accepted.some(a => a.toLowerCase() === got.trim().toLowerCase());
      const ok = exact || accepted.some(a => norm(a) === norm(got));
      inp.disabled = true; inp.classList.add(ok ? "ok" : "ko");
      finish(ex, ok, ex.sentence.replace("___", ex.answer).replace(/\s\(.*\)$/, ""), ok && !exact ? `Correct form: <span class="ans">${esc(ex.answer)}</span>` : undefined);
    };
  },

  number(ex, body) {
    const isTime = /^las?\s/.test(ex.prompt);
    body.innerHTML = `<p class="prompt es">${esc(ex.prompt)} ${sayBtn(ex.prompt)}</p>
      <div class="field"><input class="text" id="inp" inputmode="decimal" autocomplete="off" placeholder="${isTime ? "e.g. 14:30" : "e.g. 3.50"}"></div>
      <p class="hint">${isTime ? "Type the time as HH:MM (12h or 24h both fine)." : "Type the amount in digits. Use . or , for cents."}</p>`;
    const inp = body.querySelector("#inp"), chk = app.querySelector("#check"); chk.style.display = ""; chk.disabled = false; inp.focus();
    chk.onclick = () => {
      const got = normNum(inp.value); if (!got) { inp.focus(); return; }
      const ok = ex.answers.some(a => normNum(a) === got || (!isTime && parseFloat(normNum(a)) === parseFloat(got)));
      inp.disabled = true; inp.classList.add(ok ? "ok" : "ko");
      finish(ex, ok, ex.answers[0] + (isTime ? "" : " €"));
    };
  }
};

function renderSummary() {
  const s = session; const n = s.list.length; const pct = Math.round((s.score / n) * 100);
  if (s.mode === "day") { state.done[s.day.id] = { score: s.score, total: n, date: todayStr() }; bumpStreak(); save(); }
  const msg = pct >= 90 ? "¡Perfecto! Madrid no tiene secretos para ti." : pct >= 70 ? "¡Muy bien! Ready for the street." : pct >= 50 ? "Bien — drill the mistakes and you're there." : "Buen comienzo. Repeat this day tomorrow.";
  app.innerHTML = `
    <div class="summary">
      <p class="eyebrow" style="text-align:center">${esc(s.title)} · complete</p>
      <div class="flag-wrap" style="height:150px">${flagHtml(s.score / n, 190)}</div>
      <h1>${msg}</h1>
      <p class="result">${s.score} / ${n} correct · ${pct}%</p>
      ${s.wrong.length ? `<p class="eyebrow">To review (saved to your mistakes bank)</p><ul class="review-list">${s.wrong.slice(0, 12).map(w => `<li><span>${esc(w.ex.prompt || w.ex.sentence || (w.ex.d && w.ex.d.says) || w.ex.label)}</span><span class="es">${esc(w.correctText)} ${sayBtn(w.correctText)}</span></li>`).join("")}</ul>` : `<p class="muted" style="text-align:center">No mistakes. Seriously impressive.</p>`}
      <div class="actions" style="justify-content:center">
        <button class="btn ghost" id="again">Repeat</button>
        <button class="btn" id="home">Back to plan</button>
      </div>
    </div>`;
  app.querySelector("#home").addEventListener("click", renderHome);
  app.querySelector("#again").addEventListener("click", () => startSession({ ...s, list: s.mode === "day" ? buildSession(s.day) : s.mode === "mistakes" ? buildMistakeSession() : buildFlagChallenge() }));
}

renderHome();
</script>
