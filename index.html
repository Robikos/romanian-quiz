<title>Bun Venit — Romanian for Travelers</title>
<style>
  :root {
    --ink: #eef2f1;

    --ground-raised: #16262f;
    --ground-card: #1c313b;
    --line: #2b4149;
    --gold: #e6b73d;
    --gold-dim: #7d6631;
    --flag-blue: #002b7f;
    --flag-yellow: #fcd116;
    --flag-red: #ce1126;
    --good: #5fbf8f;
    --bad: #d9705a;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
  }

  :root[data-theme="light"] {
    --ink: #1b2a30;
    --ink-dim: #5c7079;
    --ground: #f3efe4;
    --ground-raised: #ffffff;
    --ground-card: #ffffff;
    --line: #d9d0bb;
    --gold: #a97a1f;
    --gold-dim: #d8c393;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --ink: #1b2a30;
      --ink-dim: #5c7079;
      --ground: #f3efe4;
      --ground-raised: #ffffff;
      --ground-card: #ffffff;
      --line: #d9d0bb;
      --gold: #a97a1f;
      --gold-dim: #d8c393;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, color-mix(in srgb, var(--gold) 10%, transparent), transparent),
      var(--ground);
    color: var(--ink);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .stage {
    width: 100%;
    max-width: 560px;
  }

  .passport {
    background: var(--ground-raised);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px 28px 32px;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.5);
  }

  header.masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
    margin-bottom: 22px;
  }

  .masthead h1 {
    font-family: var(--font-display);
    font-size: 1.5rem;
    letter-spacing: 0.02em;
    margin: 0;
    text-wrap: balance;
  }

  .masthead .sub {
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-top: 4px;
  }

  .board {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 0.85rem;
    color: var(--gold);
    text-align: right;
    line-height: 1.5;
  }

  .board .label {
    color: var(--ink-dim);
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: block;
  }

  .flag-wrap {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    height: 132px;
    margin: 4px 0 24px;
  }

  .flag {
    display: flex;
    height: 22px;
    width: 33px;
    border-radius: 2px;
    overflow: hidden;
    box-shadow: 0 4px 14px -4px rgba(0,0,0,0.45), 0 0 0 1px color-mix(in srgb, var(--line) 70%, transparent);
    transition: width 0.6s cubic-bezier(.2,.8,.2,1), height 0.6s cubic-bezier(.2,.8,.2,1), box-shadow 0.6s;
  }

  .flag div { flex: 1; }
  .flag .b { background: var(--flag-blue); }
  .flag .y { background: var(--flag-yellow); }
  .flag .r { background: var(--flag-red); }

  .prompt-eyebrow {
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 8px;
  }

  .prompt {
    font-family: var(--font-display);
    font-size: 1.55rem;
    line-height: 1.35;
    margin: 0 0 24px;
    text-wrap: balance;
    min-height: 2.7em;
  }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .opt {
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    background: var(--ground-card);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 14px 14px;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 0.98rem;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s, background 0.15s;
  }

  .opt:hover:not(:disabled) {
    border-color: var(--gold-dim);
    transform: translateY(-1px);
  }

  .opt:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  .opt .tag {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--ink-dim);
    border: 1px solid var(--line);
    border-radius: 4px;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .opt .say {
    margin-left: auto;
    font-size: 0.95rem;
    opacity: 0.45;
    flex-shrink: 0;
    padding: 4px 6px;
    border-radius: 6px;
    transition: opacity 0.15s, background 0.15s;
  }

  .opt:hover .say,
  .opt:focus-visible .say,
  .opt .say:hover,
  .opt .say:focus-visible {
    opacity: 1;
    background: color-mix(in srgb, var(--gold) 16%, transparent);
  }

  .opt:disabled { cursor: default; }
  .opt.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--ground-card)); }
  .opt.correct .tag { border-color: var(--good); color: var(--good); }
  .opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--ground-card)); }
  .opt.wrong .tag { border-color: var(--bad); color: var(--bad); }
  .opt.dim { opacity: 0.45; }

  .feedback {
    min-height: 24px;
    margin-top: 16px;
    font-size: 0.85rem;
    color: var(--ink-dim);
  }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }

  .footer-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 8px;
  }

  button.next {
    font-family: var(--font-body);
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ground);
    background: var(--gold);
    border: none;
    border-radius: 7px;
    padding: 9px 18px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  button.next.show { opacity: 1; pointer-events: auto; }
  button.next:hover { filter: brightness(1.06); }
  button.next:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .win-screen { text-align: center; }
  .win-screen .flag-wrap { height: 180px; }
  .win-screen h1 {
    font-family: var(--font-display);
    font-size: 2rem;
    margin: 6px 0 6px;
  }
  .win-screen p.result {
    color: var(--ink-dim);
    margin: 0 0 22px;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }
  .win-screen button.next {
    opacity: 1;
    pointer-events: auto;
    margin: 0 auto;
  }

  @media (prefers-reduced-motion: reduce) {
    .flag, .opt { transition: none; }
  }

  @media (max-width: 400px) {
    .options { grid-template-columns: 1fr; }
    .passport { padding: 22px 18px 26px; }
  }
</style>

  const ROUND_SIZE = 10;
  const TOTAL = ROUND_SIZE;
  const LETTERS = ["A", "B", "C", "D"];

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  let round = [];
  let index = 0;
  let score = 0;
  let answered = false;

  function buildRound() {
    const picked = shuffle(POOL).slice(0, ROUND_SIZE);
    round = picked.map(q => {
      const others = [...new Set(POOL.map(p => p.ro))].filter(ro => ro !== q.ro);
      const distractors = shuffle(others).slice(0, 3);
      const options = shuffle([q.ro, ...distractors]);
      return { en: q.en, correct: q.ro, options };
    });
  }

  function flagSize() {
    const min = 33, max = 190;
    const t = score / TOTAL;
    const w = Math.round(min + (max - min) * t);
    const h = Math.round(w * 0.667);
    return { w, h };
  }

  function renderFlag(size) {
    return `<div class="flag" style="width:${size.w}px;height:${size.h}px">
      <div class="b"></div><div class="y"></div><div class="r"></div>
    </div>`;
  }

  function render() {
    const app = document.getElementById("app");
    if (index >= TOTAL) {
      renderWin(app);
      return;
    }
    const q = round[index];
    const size = flagSize();
    app.innerHTML = `
      <header class="masthead">
        <div>
          <h1>Drum Bun</h1>
          <div class="sub">Romanian for the road</div>
        </div>
        <div class="board">
          <span class="label">Question</span>${index + 1} / ${TOTAL}
          <span class="label" style="margin-top:6px">Score</span>${score}
        </div>
      </header>
      <div class="flag-wrap">${renderFlag(size)}</div>
      <p class="prompt-eyebrow">Translate to Romanian</p>
      <p class="prompt">${q.en}</p>
      <div class="options" id="options">
        ${q.options.map((opt, i) => `
          <button class="opt" data-opt="${escapeAttr(opt)}" data-idx="${i}">
            <span class="tag">${LETTERS[i]}</span><span>${opt}</span>
            <span class="say" data-say="${escapeAttr(opt)}" role="button" aria-label="Listen to pronunciation" tabindex="0">🔊</span>
          </button>
        `).join("")}
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="footer-row">
        <button class="next" id="nextBtn">${index === TOTAL - 1 ? "See result" : "Next question"}</button>
      </div>
    `;

    answered = false;
    document.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", onAnswer);
    });
    document.querySelectorAll(".say").forEach(say => {
      say.addEventListener("click", e => {
        e.stopPropagation();
        speakRomanian(say.dataset.say);
      });
      say.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          e.stopPropagation();
          speakRomanian(say.dataset.say);
        }
      });
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      index += 1;
      render();
    });
  }

  function escapeAttr(s) {
    return s.replace(/"/g, "&quot;");
  }

  let romanianVoice = null;
  function loadVoice() {
    const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    romanianVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("ro")) || null;
  }
  if (window.speechSynthesis) {
    loadVoice();
    speechSynthesis.onvoiceschanged = loadVoice;
  }

  function speakRomanian(text) {
    if (!window.speechSynthesis || !text) return;
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "ro-RO";
    if (romanianVoice) utter.voice = romanianVoice;
    utter.rate = 0.9;
    speechSynthesis.speak(utter);
  }

  function onAnswer(e) {
    if (answered) return;
    answered = true;
    const btn = e.currentTarget;
    const chosen = btn.dataset.opt;
    const q = round[index];
    const isCorrect = chosen === q.correct;
    if (isCorrect) score += 1;

    document.querySelectorAll(".opt").forEach(o => {
      o.disabled = true;
      if (o.dataset.opt === q.correct) {
        o.classList.add("correct");
      } else if (o === btn) {
        o.classList.add("wrong");
      } else {
        o.classList.add("dim");
      }
    });

    const feedback = document.getElementById("feedback");
    feedback.textContent = isCorrect
      ? "Correct — well travelled."
      : `Not quite. Correct answer: ${q.correct}`;
    feedback.className = "feedback " + (isCorrect ? "good" : "bad");

    document.querySelector(".flag-wrap").innerHTML = renderFlag(flagSize());
    document.querySelector(".board").innerHTML = `
      <span class="label">Question</span>${index + 1} / ${TOTAL}
      <span class="label" style="margin-top:6px">Score</span>${score}
    `;

    document.getElementById("nextBtn").classList.add("show");
  }

  function renderWin(app) {
    const size = { w: 190, h: 127 };
    const perfect = score === TOTAL;
    app.innerHTML = `
      <div class="win-screen">
        <p class="prompt-eyebrow">Journey complete</p>
        <div class="flag-wrap">${renderFlag(size)}</div>
        <h1>${perfect ? "Bravo! Perfect score." : "La revedere!"}</h1>
        <p class="result">${score} / ${TOTAL} correct</p>
        <button class="next" id="again">Play again</button>
      </div>
    `;
    document.getElementById("again").addEventListener("click", () => {
      score = 0;
      index = 0;
      buildRound();
      render();
    });
  }

  buildRound();
  render();
</script>
