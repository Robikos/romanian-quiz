<style>

    --gold-dim: #7a5518;
    --flag-red: #c60b1e;
    --flag-yellow: #f1bf00;

    --font-mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
  }

  :root[data-theme="light"] {
    --ink: #1b1008;
    --ink-dim: #7a5a40;
    --ground: #fdf6ee;
    --ground-raised: #ffffff;
    --ground-card: #ffffff;
    --line: #e8d8c0;
    --gold: #a0600a;
    --gold-dim: #d8b87a;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --ink: #1b1008;
      --ink-dim: #7a5a40;
      --ground: #fdf6ee;
      --ground-raised: #ffffff;
      --ground-card: #ffffff;
      --line: #e8d8c0;
      --gold: #a0600a;
      --gold-dim: #d8b87a;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, color-mix(in srgb, var(--flag-red) 8%, transparent), transparent),
      var(--ground);
    color: var(--ink);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .stage { width: 100%; max-width: 560px; }

  .passport {
    background: var(--ground-raised);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px 28px 32px;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.5);
  }

  header.masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
    margin-bottom: 22px;
  }

  .masthead h1 {
    font-family: var(--font-display);
    font-size: 1.5rem;
    letter-spacing: 0.02em;
    margin: 0;
    text-wrap: balance;
  }

  .masthead .sub {
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-top: 4px;
  }

  .board {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 0.85rem;
    color: var(--gold);
    text-align: right;
    line-height: 1.5;
  }

  .board .label {
    color: var(--ink-dim);
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: block;
  }

  .flag-wrap {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    height: 132px;
    margin: 4px 0 24px;
  }

  /* Spanish flag: red (1) / yellow (2) / red (1) */
  .flag {
    display: flex;
    flex-direction: column;
    height: 22px;
    width: 33px;
    border-radius: 2px;
    overflow: hidden;
    box-shadow: 0 4px 14px -4px rgba(0,0,0,0.45), 0 0 0 1px color-mix(in srgb, var(--line) 70%, transparent);
    transition: width 0.6s cubic-bezier(.2,.8,.2,1), height 0.6s cubic-bezier(.2,.8,.2,1), box-shadow 0.6s;
  }

  .flag .rt { background: var(--flag-red); flex: 1; }
  .flag .y  { background: var(--flag-yellow); flex: 2; }
  .flag .rb { background: var(--flag-red); flex: 1; }

  .prompt-eyebrow {
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 8px;
  }

  .prompt {
    font-family: var(--font-display);
    font-size: 1.55rem;
    line-height: 1.35;
    margin: 0 0 24px;
    text-wrap: balance;
    min-height: 2.7em;
  }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .opt {
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    background: var(--ground-card);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 14px 14px;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 0.98rem;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s, background 0.15s;
  }

  .opt:hover:not(:disabled) { border-color: var(--gold-dim); transform: translateY(-1px); }
  .opt:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .opt .tag {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--ink-dim);
    border: 1px solid var(--line);
    border-radius: 4px;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .opt .say {
    margin-left: auto;
    font-size: 0.95rem;
    opacity: 0.45;
    flex-shrink: 0;
    padding: 4px 6px;
    border-radius: 6px;
    transition: opacity 0.15s, background 0.15s;
  }

  .opt:hover .say, .opt:focus-visible .say,
  .opt .say:hover, .opt .say:focus-visible {
    opacity: 1;
    background: color-mix(in srgb, var(--gold) 16%, transparent);
  }

  .opt:disabled { cursor: default; }
  .opt.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--ground-card)); }
  .opt.correct .tag { border-color: var(--good); color: var(--good); }
  .opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--ground-card)); }
  .opt.wrong .tag { border-color: var(--bad); color: var(--bad); }
  .opt.dim { opacity: 0.45; }

  .feedback { min-height: 24px; margin-top: 16px; font-size: 0.85rem; color: var(--ink-dim); }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }

  .footer-row { display: flex; justify-content: flex-end; margin-top: 8px; }

  button.next {
    font-family: var(--font-body);
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ground);
    background: var(--gold);
    border: none;
    border-radius: 7px;
    padding: 9px 18px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  button.next.show { opacity: 1; pointer-events: auto; }
  button.next:hover { filter: brightness(1.06); }
  button.next:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .win-screen { text-align: center; }
  .win-screen .flag-wrap { height: 180px; }
  .win-screen h1 { font-family: var(--font-display); font-size: 2rem; margin: 6px 0 6px; }
  .win-screen p.result { color: var(--ink-dim); margin: 0 0 22px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .win-screen button.next { opacity: 1; pointer-events: auto; margin: 0 auto; }

  @media (prefers-reduced-motion: reduce) { .flag, .opt { transition: none; } }
  @media (max-width: 400px) { .options { grid-template-columns: 1fr; } .passport { padding: 22px 18px 26px; } }

  .tts-toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translate(-50%, 8px);
    max-width: 90vw;
    background: var(--ground-card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.82rem;
    box-shadow: 0 12px 30px -12px rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 100;
  }
  .tts-toast.show { opacity: 1; transform: translate(-50%, 0); }

  .voice-test {
    display: block;
    margin: 14px auto 0;
    font-family: var(--font-body);
    font-size: 0.78rem;
    color: var(--ink-dim);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 7px 14px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .voice-test:hover { color: var(--ink); border-color: var(--gold-dim); }
  .voice-test:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>

  const ROUND_SIZE = 10;
  const TOTAL = ROUND_SIZE;
  const LETTERS = ["A", "B", "C", "D"];

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  let round = [], index = 0, score = 0, answered = false;

  function buildRound() {
    const picked = shuffle(POOL).slice(0, ROUND_SIZE);
    round = picked.map(q => {
      const others = [...new Set(POOL.map(p => p.es))].filter(es => es !== q.es);
      const distractors = shuffle(others).slice(0, 3);
      const options = shuffle([q.es, ...distractors]);
      return { en: q.en, correct: q.es, options };
    });
  }

  function flagSize() {
    const min = 33, max = 190;
    const t = score / TOTAL;
    const w = Math.round(min + (max - min) * t);
    const h = Math.round(w * 0.667);
    return { w, h };
  }

  function renderFlag(size) {
    return `<div class="flag" style="width:${size.w}px;height:${size.h}px">
      <div class="rt"></div><div class="y"></div><div class="rb"></div>
    </div>`;
  }

  function render() {
    const app = document.getElementById("app");
    if (index >= TOTAL) { renderWin(app); return; }
    const q = round[index];
    const size = flagSize();
    app.innerHTML = `
      <header class="masthead">
        <div>
          <h1>¡Vamos!</h1>
          <div class="sub">Spanish for the road</div>
        </div>
        <div class="board">
          <span class="label">Question</span>${index + 1} / ${TOTAL}
          <span class="label" style="margin-top:6px">Score</span>${score}
        </div>
      </header>
      <div class="flag-wrap">${renderFlag(size)}</div>
      <p class="prompt-eyebrow">Translate to Spanish</p>
      <p class="prompt">${q.en}</p>
      <div class="options" id="options">
        ${q.options.map((opt, i) => `
          <button class="opt" data-opt="${escapeAttr(opt)}" data-idx="${i}">
            <span class="tag">${LETTERS[i]}</span><span>${opt}</span>
            <span class="say" data-say="${escapeAttr(opt)}" role="button" aria-label="Listen" tabindex="0">🔊</span>
          </button>
        `).join("")}
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="footer-row">
        <button class="next" id="nextBtn">${index === TOTAL - 1 ? "See result" : "Next question"}</button>
      </div>
    `;

    answered = false;
    document.querySelectorAll(".opt").forEach(btn => btn.addEventListener("click", onAnswer));
    document.querySelectorAll(".say").forEach(say => {
      say.addEventListener("click", e => { e.stopPropagation(); speakSpanish(say.dataset.say); });
      say.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); speakSpanish(say.dataset.say); }
      });
    });
    document.getElementById("nextBtn").addEventListener("click", () => { index += 1; render(); });
  }

  function escapeAttr(s) { return s.replace(/"/g, "&quot;"); }

  let spanishVoice = null;
  function loadVoice() {
    const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    spanishVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("es")) || null;
    return voices;
  }
  if (window.speechSynthesis) {
    loadVoice();
    speechSynthesis.onvoiceschanged = loadVoice;
  }

  function showToast(msg) {
    let toast = document.getElementById("ttsToast");
    if (!toast) {
      toast = document.createElement("div");
      toast.id = "ttsToast";
      toast.className = "tts-toast";
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove("show"), 4500);
  }

  let currentUtterance = null;

  function speakSpanish(text) {
    if (!text) return;
    if (!window.speechSynthesis) { showToast("This browser doesn't support text-to-speech."); return; }
    const voices = loadVoice();

    const doSpeak = () => {
      if (speechSynthesis.paused) speechSynthesis.resume();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "es-ES";
      if (spanishVoice) utter.voice = spanishVoice;
      utter.rate = 0.9;
      currentUtterance = utter;
      let started = false;
      utter.onstart = () => { started = true; };
      utter.onend = () => { if (currentUtterance === utter) currentUtterance = null; };
      utter.onerror = (ev) => {
        if (ev.error === "canceled" || ev.error === "interrupted") return;
        showToast("Couldn't play audio (" + ev.error + ").");
      };
      try { speechSynthesis.speak(utter); } catch (err) { showToast("Speech failed to start."); return; }
      setTimeout(() => {
        if (!started && !speechSynthesis.speaking && !speechSynthesis.pending) {
          showToast(voices.length === 0
            ? "No text-to-speech voices installed on this device."
            : "Speech didn't play — no Spanish voice found; try a different browser.");
        }
      }, 900);
    };

    if (speechSynthesis.speaking || speechSynthesis.pending) {
      speechSynthesis.cancel();
      setTimeout(doSpeak, 130);
    } else {
      doSpeak();
    }
  }

  function onAnswer(e) {
    if (answered) return;
    answered = true;
    const btn = e.currentTarget;
    const chosen = btn.dataset.opt;
    const q = round[index];
    const isCorrect = chosen === q.correct;
    if (isCorrect) score += 1;

    document.querySelectorAll(".opt").forEach(o => {
      o.disabled = true;
      if (o.dataset.opt === q.correct) o.classList.add("correct");
      else if (o === btn) o.classList.add("wrong");
      else o.classList.add("dim");
    });

    const feedback = document.getElementById("feedback");
    feedback.textContent = isCorrect ? "¡Correcto! — well travelled." : `Not quite. Correct answer: ${q.correct}`;
    feedback.className = "feedback " + (isCorrect ? "good" : "bad");

    document.querySelector(".flag-wrap").innerHTML = renderFlag(flagSize());
    document.querySelector(".board").innerHTML = `
      <span class="label">Question</span>${index + 1} / ${TOTAL}
      <span class="label" style="margin-top:6px">Score</span>${score}
    `;
    document.getElementById("nextBtn").classList.add("show");
  }

  function renderWin(app) {
    const size = { w: 190, h: 127 };
    const perfect = score === TOTAL;
    app.innerHTML = `
      <div class="win-screen">
        <p class="prompt-eyebrow">¡Viaje completo!</p>
        <div class="flag-wrap">${renderFlag(size)}</div>
        <h1>${perfect ? "¡Perfecto! Perfect score." : "¡Hasta luego!"}</h1>
        <p class="result">${score} / ${TOTAL} correct</p>
        <button class="next" id="again">Play again</button>
      </div>
    `;
    document.getElementById("again").addEventListener("click", () => { score = 0; index = 0; buildRound(); render(); });
  }

  document.getElementById("voiceTest").addEventListener("click", () => speakSpanish("¡Hola! Bienvenido a España."));
  buildRound();
  render();
</script>
